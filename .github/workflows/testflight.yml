name: Upload Qall to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: io.github.aoringo0606.qall
      EXTENSION_BUNDLE_ID: io.github.aoringo0606.qall.BroadcastExtension
      APP_GROUP_ID: group.io.github.aoringo0606.qall
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: xcodebuild -version
      - run: flutter pub get --enforce-lockfile
      - run: flutter test

      - name: Install signing assets
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          EXTENSION_PROFILE_BASE64: ${{ secrets.APPLE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          : "${TEAM_ID:?APPLE_TEAM_ID is required}"
          : "${CERT_BASE64:?APPLE_CERTIFICATE_BASE64 is required}"
          : "${PROFILE_BASE64:?APPLE_PROVISIONING_PROFILE_BASE64 is required}"
          : "${EXTENSION_PROFILE_BASE64:?APPLE_EXTENSION_PROVISIONING_PROFILE_BASE64 is required}"
          printf '%s' "$CERT_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$EXTENSION_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/extension.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$RUNNER_TEMP/extension.mobileprovision" > "$RUNNER_TEMP/extension-profile.plist"
          python3 .github/scripts/configure-ios-signing.py

      - name: Build signed IPA
        run: |
          set -euo pipefail
          # Existing pubspec build number is 2; start CI uploads at 3.
          BUILD_NUMBER="$((GITHUB_RUN_NUMBER + 2))"
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          # Flutter can finish successfully even when Xcode's IPA export fails.
          test -n "$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Verify IPA identifiers
        run: |
          set -euo pipefail

          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"

          WORK_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$WORK_DIR"

          APP_PATH="$(find "$WORK_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"

          echo "=== App Bundle ID ==="
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist"

          echo "=== App Version ==="
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist"

          echo "=== Build Number ==="
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Info.plist"

          echo "=== Extension Bundle IDs ==="
          find "$APP_PATH/PlugIns" -name Info.plist -print -exec \
            /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" {} \;

          echo "=== Verify expected Bundle IDs ==="
          ACTUAL_ID="$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist")"
          test "$ACTUAL_ID" = "$BUNDLE_ID"

          EXTENSION_PATH="$(find "$APP_PATH/PlugIns" -maxdepth 1 -name '*.appex' -print -quit)"
          test -n "$EXTENSION_PATH"
          ACTUAL_EXTENSION_ID="$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$EXTENSION_PATH/Info.plist")"
          test "$ACTUAL_EXTENSION_ID" = "$EXTENSION_BUNDLE_ID"

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${API_KEY_ID:?APPSTORE_API_KEY_ID is required}"
          : "${API_ISSUER_ID:?APPSTORE_API_ISSUER_ID is required}"
          : "${API_PRIVATE_KEY:?APPSTORE_API_PRIVATE_KEY is required}"
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$API_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${API_KEY_ID}.p8"
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Remove signing assets
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/extension.mobileprovision" \
            "$RUNNER_TEMP/app-profile.plist" "$RUNNER_TEMP/extension-profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist"
          if [ -n "$API_KEY_ID" ]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          fi
          # Hosted runner is disposable; remove only the profiles installed by this job.
          if [ -f "$RUNNER_TEMP/installed-profile-paths.txt" ]; then
            while IFS= read -r profile; do rm -f "$profile"; done \
              < "$RUNNER_TEMP/installed-profile-paths.txt"
          fi
