name: Release

# v1.2.3 のようなタグを push すると、署名済みの APK をビルドして GitHub Releases に置く
on:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: 3.47.7

permissions:
  contents: read

jobs:
  android:
    name: Build & release APK
    runs-on: ubuntu-latest
    # 署名鍵の Secrets は release 環境に置き、v* タグからしか読めないようにする
    environment: release
    permissions:
      contents: write
    steps:
      # 署名鍵を扱うジョブなので、サードパーティーの action はコミットSHAで固定する
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 が設定されていません"
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          # 鍵のエイリアスは秘密ではないので Secret にしない (ログ中の同じ文字列が伏せ字になるため)
          printf '%s\n' \
            "storeFile=release.jks" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=qall" \
            "keyPassword=$KEY_PASSWORD" > android/key.properties

      - name: Build APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "qall-$VERSION.apk"

      - name: Remove signing key
        if: always()
        run: rm -f android/release.jks android/key.properties

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "qall-${GITHUB_REF_NAME#v}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
